services:
  app:
    # デプロイでは IMAGE_TAG に commit SHA を渡し，push した commit のイメージを確実に使う（latest は後から上書きされうる）
    image: ghcr.io/babcs2035/my-assets:${IMAGE_TAG:-latest}
    container_name: my-assets-app
    restart: unless-stopped
    # 同期処理のログには摘要と金額が出るので，ホストのディスクに際限なく残さない
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # node:slim には curl がないので Node の fetch で確かめる．DB を読むページは集計が重いので，静的な /analysis を見る．
    # 起動時に migrate deploy と seed が先に走るので，start_period を長めにとる
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/my-assets/analysis').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-my-assets_user}:${POSTGRES_PASSWORD:-my-assets_password}@my-assets-db:5432/${POSTGRES_DB:-my-assets}
      TZ: ${TZ:-Asia/Tokyo}
      APP_PORT: ${APP_PORT:-3000}
      OP_MF_ITEM_ID: ${OP_MF_ITEM_ID:-MF_Main}
      OP_VAULT: ${OP_VAULT:-}
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-http://host.docker.internal:18080/v1/chat/completions}
      LLAMA_MODEL_NAME: ${LLAMA_MODEL_NAME:-unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_XL}
    volumes:
      # Pre-extracted credentials (from deploy host)
      - ./data/runtime/op-secrets.json:/app/op-secrets.json:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16-alpine
    container_name: my-assets-db
    restart: unless-stopped
    command: ["postgres", "-p", "5432"]
    # postgres のエラーログには失敗した SQL の値が出ることがあるので，app と同じく上限を設ける
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my-assets_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my-assets_password}
      POSTGRES_DB: ${POSTGRES_DB:-my-assets}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # postgres は command で 5432 に固定して起動するので，DB_PORT（ホスト側の公開ポート用）は見ない
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-my-assets_user} -d ${POSTGRES_DB:-my-assets}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
