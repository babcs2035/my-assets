allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - msw
  - prisma

overrides:
  tailwind-merge: "^3.6.0"
  reselect: "^5.2.0"
  semver: "^7.7.1"
  brace-expansion: "^5.0.9"
  js-yaml: "^4.3.1"
  fast-uri: "^3.1.5"
  postcss: "^8.5.23"
  undici: "^7.29.0"
  ip-address: "^10.3.1"
  hono: "^4.12.34"
  "@hono/node-server": "^2.0.5"

strictDepBuilds: true
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
