allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true

ignoredBuiltDependencies:
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - msw
  - prisma

overrides:
  tailwind-merge: "^3.7.0"
  reselect: "^5.2.0"
  semver: "^7.7.1"
  brace-expansion: "^5.0.12"
  js-yaml: "^4.3.2"
  fast-uri: "^3.1.8"
  postcss: "^8.5.23"
  undici: "^7.29.1"
  ip-address: "^10.7.1"
  hono: "^4.13.7"
  "@hono/node-server": "^2.0.5"
  qs: "^6.16.0"
  sharp: "^0.35.4"
  deepmerge-ts: "^8.0.0"
  mysql2: "^3.23.1"
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  postcss-selector-parser: "^7.1.6"

strictDepBuilds: true
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
