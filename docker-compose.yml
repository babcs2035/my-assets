services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-assets-app
    restart: unless-stopped
    # 同期処理のログには摘要と金額が出るので，ホストのディスクに際限なく残さない
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # docker-compose.production.yml と同じ確認（理由はそちらのコメントを参照）
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/my-assets/analysis').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      # db サービスと同じ環境変数から接続先を組み立てる（.env.example 由来のパスワードでも一致する）
      DATABASE_URL: postgresql://${POSTGRES_USER:-my-assets_user}:${POSTGRES_PASSWORD:-my-assets_password}@db:5432/${POSTGRES_DB:-my-assets}
      TZ: Asia/Tokyo
      APP_PORT: ${APP_PORT:-3000}
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN:-}
      OP_MF_ITEM_ID: ${OP_MF_ITEM_ID:-MF_Main}
    volumes:
      - ./data/runtime/op-secrets.json:/app/op-secrets.json:ro
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:16-alpine
    container_name: my-assets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my-assets_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my-assets_password}
      POSTGRES_DB: ${POSTGRES_DB:-my-assets}
      DB_PORT: ${DB_PORT:-5432}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my-assets_user} -d ${POSTGRES_DB:-my-assets}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
