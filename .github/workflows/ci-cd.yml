name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Jobs that need more (packages: write / read) ask for it themselves
permissions:
  contents: read

# Process pushes to main one at a time so an older deploy cannot finish after a newer one.
# On pull requests a new push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  ci-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Format & Lint Check with Biome
        run: pnpm biome ci ./src

      - name: Run Type Check
        run: pnpm tsc --noEmit

      - name: Run Unit Tests
        run: pnpm test

      # Errors that only next build reports would otherwise surface after merging to main
      - name: Build Next.js application
        run: pnpm build

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ci-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only and no push: this only checks that the Dockerfile still builds
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-checks
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v8.1.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy job runs the commit SHA tag; latest is kept for manual use
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/babcs2035/my-assets:latest,ghcr.io/babcs2035/my-assets:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is sent to the deploy host only to pull the image
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Upload compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_TARGET }}
          source: "docker-compose.production.yml"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

            cd "${{ secrets.DEPLOY_TARGET }}"
            mv docker-compose.production.yml docker-compose.yml

            if [ ! -f .env ]; then
              echo ".env is missing in deploy target: ${{ secrets.DEPLOY_TARGET }}" >&2
              exit 1
            fi

            # DATABASE_URL is not checked: docker-compose.yml builds it from POSTGRES_*
            if ! grep -q '^POSTGRES_PASSWORD=' .env || [ -z "$(grep '^POSTGRES_PASSWORD=' .env | tail -n1 | cut -d= -f2-)" ]; then
              echo "POSTGRES_PASSWORD is required in deploy .env." >&2
              exit 1
            fi

            set -a
            . ./.env
            set +a

            # Run the image built from this commit; latest may already point at another push
            export IMAGE_TAG="${{ github.sha }}"

            if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
              echo "OP_SERVICE_ACCOUNT_TOKEN is required in deploy .env." >&2
              exit 1
            fi

            if ! command -v op >/dev/null 2>&1; then
              echo "op command not found on deploy host. Install 1Password CLI on host." >&2
              exit 1
            fi

            # op-secrets.json holds passwords and TOTP secrets. The file stays 0644 so uid 1001 in the
            # container can read the bind mount, and the 0700 directory keeps other host users out.
            mkdir -p data/runtime
            chmod 700 data/runtime

            export OP_VAULT="${OP_VAULT:-}"

            # This Python runs inside single quotes in the shell: use only double quotes in it
            python3 -c '
            import json, os, subprocess, sys, tempfile

            OP_VAULT_VALUE = os.environ.get("OP_VAULT", "")
            OP_MF_ITEM_ID_RAW = os.environ.get("OP_MF_ITEM_ID", "MF_Main")
            SECRETS_PATH = "data/runtime/op-secrets.json"

            # Split comma-separated item IDs, trim whitespace, filter empty
            item_ids = [
                x.strip()
                for x in OP_MF_ITEM_ID_RAW.split(",")
                if x.strip()
            ]
            if not item_ids:
                item_ids = ["MF_Main"]

            def extract_item(item_id: str, vault: str) -> dict:
                cmd = ["op", "item", "get", item_id]
                if vault:
                    cmd.extend(["--vault", vault])
                cmd.append("--reveal")
                cmd.extend(["--format", "json"])
                result = subprocess.run(cmd, capture_output=True, text=True)
                if result.returncode != 0:
                    print(f"  Warning: Failed to get item {item_id}: {result.stderr.strip()}", flush=True)
                    return {}

                item = json.loads(result.stdout)
                fields_dict = {}
                otp_uri = None
                label = ""

                # Debug: log all field labels and types (values hidden for security)
                # Reusing the f-string quote inside {} needs Python 3.12+, and the host version is unknown
                for field in item.get("fields", []):
                    field_label = field.get("label")
                    field_type = field.get("type")
                    print(f"  Field: label={field_label}, type={field_type}", flush=True)

                for field in item.get("fields", []):
                    label = str(field.get("label", "")).strip().lower()
                    ftype = str(field.get("type", "")).strip().upper()
                    value = field.get("value")

                    if ftype == "PASSWORD" and str(field.get("purpose", "")).lower() != "otp":
                        fields_dict["password"] = str(value) if value else None
                    elif label == "username" or label == "email" or label == "acct_id":
                        fields_dict["username"] = str(value) if value else None

                    if ftype == "OTP" and isinstance(value, str):
                        otp_uri = value
                    elif label in ("otp", "totp") and isinstance(value, str) and value.startswith("otpauth://"):
                        otp_uri = value

                # Fallback: if no PASSWORD type field found, use label-based matching
                if "password" not in fields_dict:
                    for field in item.get("fields", []):
                        label = str(field.get("label", "")).strip().lower()
                        value = field.get("value")
                        if label == "password" and value is not None:
                            fields_dict["password"] = str(value)
                            break

                if otp_uri:
                    fields_dict["otp_uri"] = otp_uri

                return {k: v for k, v in fields_dict.items() if v is not None}

            items = {}
            failed_item_ids = []
            for item_id in item_ids:
                print(f"Fetching item {item_id} from 1Password...", flush=True)
                mf = extract_item(item_id, OP_VAULT_VALUE)
                if mf:
                    items[item_id] = mf
                    print(f"  Got: {list(mf.keys())}", flush=True)
                else:
                    failed_item_ids.append(item_id)
                    print(f"  WARNING: MF item {item_id} is empty!", flush=True)

            # Stop the deploy and keep the previous file: otherwise the failure only shows at the next scheduled sync
            if failed_item_ids:
                print(f"ERROR: Could not get 1Password items: {failed_item_ids}", flush=True)
                sys.exit(1)

            # Write to a temporary file and rename it, so an interrupted write cannot leave a broken file.
            # A running container keeps the old inode, but docker compose up --force-recreate below mounts the new one.
            fd, tmp_path = tempfile.mkstemp(dir="data/runtime", prefix=".op-secrets.", suffix=".json")
            with os.fdopen(fd, "w", encoding="utf-8") as f:
                json.dump({"items": items}, f, ensure_ascii=False)
            os.chmod(tmp_path, 0o644)
            os.replace(tmp_path, SECRETS_PATH)
            print(f"Saved op-secrets.json with items: {list(items.keys())}", flush=True)
            '

            docker compose pull --quiet

            # Dump the database before migrating: the postgres_data volume is the only copy of the data, and
            # migrate deploy cannot roll back a failed migration. --wait starts db on the first deploy and waits for its healthcheck.
            # The dump holds transaction data, so the directory is 0700 and umask 077 makes the file 0600.
            echo "Backing up the database..."
            docker compose up -d --wait db
            mkdir -p data/backups
            chmod 700 data/backups
            backup_path="data/backups/my-assets-deploy-$(date +%Y%m%d-%H%M%S)-$(printf '%s' "$IMAGE_TAG" | cut -c1-7).dump"
            # -Fc compresses without a pipe, so the exit status is pg_dump's own
            if ! (umask 077 && docker compose exec -T db sh -c 'pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$backup_path.tmp"); then
              rm -f "$backup_path.tmp"
              echo "ERROR: Database backup failed. Aborting deploy." >&2
              exit 1
            fi
            mv "$backup_path.tmp" "$backup_path"
            # Keep the 10 newest deploy dumps. Dumps with other names (for example from cron) are left alone
            ls -1t data/backups/my-assets-deploy-*.dump | tail -n +11 | xargs -r rm --
            echo "Database backed up to $backup_path."

            # Apply database migrations explicitly before starting the app
            echo "Applying database migrations..."
            if ! docker compose run --rm app prisma migrate deploy; then
              echo "ERROR: Database migration failed. Aborting deploy." >&2
              exit 1
            fi
            echo "Database migrations applied successfully."

            docker compose up -d --force-recreate --remove-orphans

            # "running" is also true for a container in a restart loop, so wait for the healthcheck
            # (start_period 120s, interval 30s). App logs are not printed: they contain transaction data.
            echo "Waiting for my-assets-app to become healthy..."
            health=""
            for _ in $(seq 1 48); do
              health=$(docker inspect --format '{{.State.Health.Status}}' my-assets-app 2>/dev/null || echo "missing")
              if [ "$health" = "healthy" ] || [ "$health" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done
            if [ "$health" != "healthy" ]; then
              echo "my-assets-app is not healthy (status: $health). Check docker compose logs app on the host." >&2
              docker compose ps
              exit 1
            fi
            echo "my-assets-app is healthy: ghcr.io/babcs2035/my-assets:${IMAGE_TAG}"
